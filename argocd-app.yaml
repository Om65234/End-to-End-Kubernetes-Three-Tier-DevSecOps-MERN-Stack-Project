apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mern-three-tier-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Om65234/End-to-End-k8s-manifests.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
